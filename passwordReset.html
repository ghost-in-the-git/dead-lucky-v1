<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="images/Favicon_32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/Favicon_16x16.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Set a new password - Dead Lucky">
    <title>Reset Password | Dead Lucky</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Jersey+25&display=swap" rel="stylesheet">
    <style>
        .btn-primary { background: #ed0000 !important; }
    </style>
</head>
<body>
    <main>
        <div class="container" style="display: flex; flex-direction: column; gap: var(--spacing-lg); max-width: 420px; margin: 0 auto; padding: var(--spacing-xl) 0;">
            <a href="https://deadluckygame.com" class="logo" style="align-self: center; margin-bottom: var(--spacing-md);">
                <img src="images/DEAD_LUCKY_LOGO_LONG.png" alt="Dead Lucky" class="logo-image">
            </a>

            <div id="stateChecking" style="text-align: center; color: var(--color-text-secondary);">
                Checking link…
            </div>

            <div id="stateInvalid" style="display: none; text-align: center;">
                <p style="color: var(--color-text-secondary); margin-bottom: var(--spacing-md);">This link is invalid or has expired. Request a new password reset from the game.</p>
                <a href="https://play.deadluckygame.com/" class="btn btn-primary" style="display: inline-block; padding: var(--spacing-md) var(--spacing-lg);">Go to Game</a>
            </div>

            <div id="stateForm" style="display: none;">
                <h1 style="font-size: 1.5rem; margin-bottom: var(--spacing-sm);">Set new password</h1>
                <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: var(--spacing-md);">Enter your new password below.</p>
                <form id="resetForm" class="contact-form" style="max-width: 100%;">
                    <div class="form-group">
                        <label for="newPassword" class="form-label">New password</label>
                        <input type="password" id="newPassword" name="password" class="form-input" placeholder="New password" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm password" required minlength="6" autocomplete="new-password">
                    </div>
                    <div id="formError" style="display: none; color: var(--color-accent-primary); font-size: 0.9rem; margin-bottom: var(--spacing-sm);"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: var(--spacing-md) var(--spacing-lg);">Set password</button>
                </form>
            </div>

            <div id="stateSubmitting" style="display: none; text-align: center; color: var(--color-text-secondary);">
                Setting new password…
            </div>

            <div id="stateSuccess" style="display: none; text-align: center;">
                <p style="color: var(--color-text-primary); margin-bottom: var(--spacing-md);">Password updated. You can sign in with your new password.</p>
                <a href="https://play.deadluckygame.com/" class="btn btn-primary" style="display: inline-block; padding: var(--spacing-md) var(--spacing-lg);">Go to Game</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        (function() {
            // Replace with your Supabase project URL and anon (public) key
            var SUPABASE_URL = 'https://dzkivxaxyyczskdzgcib.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6a2l2eGF4eXljenNrZHpnY2liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3MzQ5NzIsImV4cCI6MjA3NzMxMDk3Mn0.nbjntsPEwIps1IWeQew4yZlrWXooXok51eTmP6hKMFM';

            var stateChecking = document.getElementById('stateChecking');
            var stateInvalid = document.getElementById('stateInvalid');
            var stateForm = document.getElementById('stateForm');
            var stateSubmitting = document.getElementById('stateSubmitting');
            var stateSuccess = document.getElementById('stateSuccess');
            var resetForm = document.getElementById('resetForm');
            var formError = document.getElementById('formError');

            function show(state) {
                stateChecking.style.display = 'none';
                stateInvalid.style.display = 'none';
                stateForm.style.display = 'none';
                stateSubmitting.style.display = 'none';
                stateSuccess.style.display = 'none';
                if (state) state.style.display = 'block';
            }

            function showError(msg) {
                formError.textContent = msg || '';
                formError.style.display = msg ? 'block' : 'none';
            }

            // Parse fragment: #access_token=...&refresh_token=...&type=recovery
            var hash = window.location.hash ? window.location.hash.slice(1) : '';
            var params = new URLSearchParams(hash);
            var type = params.get('type');
            var accessToken = params.get('access_token');
            var refreshToken = params.get('refresh_token');

            if (type !== 'recovery' || !accessToken || !refreshToken) {
                show(stateInvalid);
                return;
            }

            var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken })
                .then(function() {
                    show(stateForm);
                })
                .catch(function() {
                    show(stateInvalid);
                });

            resetForm.addEventListener('submit', function(e) {
                e.preventDefault();
                var password = document.getElementById('newPassword').value;
                var confirm = document.getElementById('confirmPassword').value;

                if (password !== confirm) {
                    showError('Passwords do not match.');
                    return;
                }
                if (password.length < 6) {
                    showError('Password must be at least 6 characters.');
                    return;
                }

                showError('');
                show(stateSubmitting);

                supabase.auth.updateUser({ password: password })
                    .then(function() {
                        // Remove tokens from URL so they are not stored in history
                        if (window.history && window.history.replaceState) {
                            window.history.replaceState(null, '', window.location.pathname + window.location.search);
                        }
                        show(stateSuccess);
                    })
                    .catch(function(err) {
                        show(stateForm);
                        showError(err && err.message ? err.message : 'Could not update password. Try again or request a new link.');
                    });
            });
        })();
    </script>
</body>
</html>
